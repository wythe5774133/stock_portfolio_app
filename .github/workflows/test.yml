# 測試流程：PR 時執行靜態分析、全部單元／widget 測試與網頁版建置檢查。
# 推送到 master 時由 deploy.yml 呼叫本流程，通過後才部署。

name: test

on:
  pull_request:
  workflow_call: {}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite (drift 記憶體資料庫測試用)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Build web (確認網頁版可建置)
        run: flutter build web --release
