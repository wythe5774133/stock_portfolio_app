# 部署流程：推送到 master（含合併 PR）時先跑 test.yml，通過後建置網頁版部署到
# Cloudflare Pages，並部署 worker/ 的 Yahoo 代理 Worker。
# 需在 repo 的 Settings → Secrets and variables → Actions 設定
# CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID；未設定時略過部署（不會失敗）。

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT_NAME: stock-portfolio # Cloudflare Pages 專案名稱

jobs:
  test:
    uses: ./.github/workflows/test.yml

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, check-secrets]
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release

      - name: Resolve Pages production branch
        id: pages
        run: |
          branch=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME" \
            | jq -r '.result.production_branch // empty')
          if [ -z "$branch" ]; then
            echo "::error::讀不到 Pages 專案 $PAGES_PROJECT_NAME 的正式分支，請確認專案名稱與 Token 權限（Cloudflare Pages: Edit）"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy web to Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy build/web
          --project-name="$PAGES_PROJECT_NAME"
          --branch="${{ steps.pages.outputs.branch }}"
          --commit-hash="$GITHUB_SHA"

      - name: Deploy Yahoo proxy Worker
        working-directory: worker
        run: npx --yes wrangler@4 deploy
